name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('ci-{0}', github.sha) }}

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugins:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (VST3, AU, CLAP)
            os: macos-15
            artifact: macOS-universal
          - name: Windows (VST3, CLAP)
            os: windows-2022
            artifact: Windows-x64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure (macOS universal)
        if: runner.os == 'macOS'
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"
          -DMEGADSP_ADHOC_SIGN=ON

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DMEGADSP_ADHOC_SIGN=OFF

      - name: Build VST3, CLAP, and tests
        run: cmake --build build --config Release --target megaDSP_VST3 megaDSP_CLAP megaDSPTests --parallel 4

      - name: Build Audio Unit
        if: runner.os == 'macOS'
        run: cmake --build build --config Release --target megaDSP_AU --parallel 4

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package plugins (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p package/megaDSP release
          cp -R build/megaDSP_artefacts/Release/VST3 package/megaDSP/
          cp -R build/megaDSP_artefacts/Release/AU package/megaDSP/
          cp -R build/megaDSP_artefacts/Release/CLAP package/megaDSP/
          tar -czf "release/megaDSP-${RELEASE_VERSION}-macOS-universal.tar.gz" -C package megaDSP

      - name: Package plugins (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package/megaDSP/VST3, package/megaDSP/CLAP, release
          Copy-Item build/megaDSP_artefacts/Release/VST3/megaDSP.vst3 package/megaDSP/VST3/megaDSP.vst3 -Recurse
          Copy-Item build/megaDSP_artefacts/Release/CLAP/megaDSP.clap package/megaDSP/CLAP/megaDSP.clap
          Compress-Archive -Path package/megaDSP -DestinationPath "release/megaDSP-$env:RELEASE_VERSION-Windows-x64.zip"

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: megaDSP-${{ matrix.artifact }}
          path: release/*
          if-no-files-found: error
          compression-level: 0

  linux-plugins:
    name: Linux ${{ matrix.arch }} (VST3, CLAP; glibc 2.31)
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            os: ubuntu-24.04
            elf_architecture: x86-64
          - arch: arm64
            os: ubuntu-24.04-arm
            elf_architecture: ARM aarch64
    runs-on: ${{ matrix.os }}
    container: ubuntu:20.04

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install --no-install-recommends -y \
            binutils \
            ca-certificates \
            file \
            gcc-10 \
            g++-10 \
            git \
            libasound2-dev \
            libfontconfig1-dev \
            libfreetype-dev \
            libgl1-mesa-dev \
            libx11-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxext-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxrender-dev \
            ninja-build \
            python3-pip \
            xauth \
            xvfb
          python3 -m pip install --no-cache-dir "cmake==3.31.6"

      - name: Configure
        env:
          CC: gcc-10
          CXX: g++-10
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_AR=/usr/bin/gcc-ar-10
          -DCMAKE_NM=/usr/bin/gcc-nm-10
          -DCMAKE_RANLIB=/usr/bin/gcc-ranlib-10
          -DMEGADSP_ADHOC_SIGN=OFF

      - name: Build VST3, CLAP, and tests
        run: cmake --build build --config Release --target megaDSP_VST3 megaDSP_CLAP megaDSPTests --parallel 4

      - name: Test
        run: xvfb-run --auto-servernum ctest --test-dir build -C Release --output-on-failure

      - name: Verify Linux binary compatibility
        shell: bash
        run: |
          mapfile -t binaries < <(
            find \
              build/megaDSP_artefacts/Release/VST3 \
              build/megaDSP_artefacts/Release/CLAP \
              -type f -exec file {} \; |
              awk -F: '/ELF .* shared object/ { print $1 }'
          )
          if [[ ${#binaries[@]} -ne 2 ]]; then
            printf 'Expected two plugin binaries, found %s\n' "${#binaries[@]}" >&2
            exit 1
          fi

          file "${binaries[@]}" | grep -F "${{ matrix.elf_architecture }}"
          max_glibc=$(
            objdump -T "${binaries[@]}" |
              sed -n 's/.*GLIBC_\([0-9][0-9.]*\).*/\1/p' |
              sort -V |
              tail -1
          )
          if [[ -z "$max_glibc" ||
                "$(printf '%s\n' "$max_glibc" "2.31" | sort -V | tail -1)" != "2.31" ]]; then
            printf 'Plugin requires glibc %s; expected no newer than 2.31\n' "${max_glibc:-unknown}" >&2
            exit 1
          fi
          printf 'Verified %s binaries with maximum glibc requirement %s\n' \
            "${{ matrix.arch }}" "$max_glibc"

      - name: Package plugins
        run: |
          mkdir -p package/megaDSP release
          cp -R build/megaDSP_artefacts/Release/VST3 package/megaDSP/
          cp -R build/megaDSP_artefacts/Release/CLAP package/megaDSP/
          tar -czf "release/megaDSP-${RELEASE_VERSION}-Linux-${{ matrix.arch }}.tar.gz" -C package megaDSP

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: megaDSP-Linux-${{ matrix.arch }}
          path: release/*
          if-no-files-found: error
          compression-level: 0
